<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" width="520" height="128">
  <!-- AliExpress Coupon Wizard — horizontal logo (transparent background, for light surfaces). -->
  <defs>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#E62E2E"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6A00"/>
      <stop offset="1" stop-color="#E62E2E"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(0 4)">
    <g fill="#FF8A3D">
      <path d="M106 20 l2.6 6.4 6.4 2.6 -6.4 2.6 -2.6 6.4 -2.6 -6.4 -6.4 -2.6 6.4 -2.6z"/>
      <path d="M18 40 l1.8 4.4 4.4 1.8 -4.4 1.8 -1.8 4.4 -1.8 -4.4 -4.4 -1.8 4.4 -1.8z"/>
      <circle cx="26" cy="72" r="2.4"/>
    </g>
    <ellipse cx="64" cy="99" rx="50" ry="12" fill="#B91C1C"/>
    <ellipse cx="64" cy="96" rx="50" ry="12" fill="url(#hat)"/>
    <path d="M34 95 C46 74 55 55 61 34 C64 24 76 16 86 22 C92 26 88 34 82 32 C76 30 72 32 70 38 C78 58 86 77 94 95 Z" fill="url(#hat)"/>
    <path d="M39 86 C54 92 76 92 90 86 L94 95 L34 95 Z" fill="#B91C1C"/>
    <path d="M14 96 a50 12 0 0 0 100 0 a50 6 0 0 1 -100 0z" fill="#E62E2E" opacity=".55"/>
    <text x="65" y="80" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="38" fill="#FFFFFF">$</text>
  </g>

  <!-- wordmark -->
  <text x="138" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="40" letter-spacing="-0.5" fill="#1F2937">Coupon</text>
  <text x="138" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="46" letter-spacing="-1" fill="url(#text)">Wizard</text>
  <text x="312" y="60" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="16" letter-spacing="2" fill="#9CA3AF">FOR ALIEXPRESS</text>
</svg>
